# Local development services (self-hosted VPS migration).
# Postgres + MinIO. No prod credentials here. Dev and prod now share the exact
# same auth code path (real Postgres, no emulator distinction needed).
# Start with: npm run dev:infra  (docker compose up -d)
services:
  postgres:
    image: postgres:16
    container_name: qassistant-postgres
    environment:
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-qassistant}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bootstraps the app_user / app_superadmin / app_migrator roles before the
      # app or migrations connect. Runs only on a fresh volume.
      - ./infra/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_BOOTSTRAP_USER:-postgres} -d ${DB_NAME:-qassistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. The S3Gcs{Signer,Reader,Deleter} drivers
  # target this when STORAGE_DRIVER=s3 / S3_ENDPOINT points here — the same
  # path used in prod against a real MinIO deployment.
  minio:
    image: minio/minio:latest
    container_name: qassistant-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-qassistant-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-qassistant-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the artifacts bucket, then exits. `docker compose up -d
  # --wait` does not wait on one-shot containers, but it runs before the api
  # container's first request in practice since it starts as soon as minio is
  # healthy.
  minio-init:
    image: minio/mc:latest
    container_name: qassistant-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-qassistant-dev} ${S3_SECRET_ACCESS_KEY:-qassistant-dev-secret} &&
      mc mb --ignore-existing local/${ARTIFACTS_BUCKET:-qassistant-artifacts-local}
      "

volumes:
  pgdata:
  miniodata:
